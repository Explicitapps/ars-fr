# À chaque release publiée (tag vX.Y.Z) : teste, fixe version et lien de téléchargement
# dans module.json, puis joint module.json et module.zip à la release.
name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/
      - name: module.json de la release
        env:
          TAG: ${{ github.event.release.tag_name }}
          DEPOT: ${{ github.repository }}
        run: |
          jq --arg v "${TAG#v}" --arg dl "https://github.com/$DEPOT/releases/download/$TAG/module.zip" \
             '.version = $v | .download = $dl' module.json > module.tmp && mv module.tmp module.json
      - run: zip -r module.zip module.json LICENSE.md README.md lang compendium scripts
      - name: Joindre à la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" module.json module.zip --clobber
